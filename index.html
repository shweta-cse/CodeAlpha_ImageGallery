<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>My Image Gallary</h1>
    
    <div class="filters">
    <button data-filter="all">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="city">City</button>
    <button data-filter="animals">Animals</button>
    </div>

    <div class="gallary">"
        <div class="gallery">

    <div class="image-card" data-category="nature">
        <img src="images/nature1.jpg" alt="Nature">
    </div>

    <div class="image-card" data-category="nature">
        <img src="images/nature2.jpg" alt="Nature">
    </div>

    <div class="image-card" data-category="city">
        <img src="images/city1.jpg" alt="City">
    </div>

    <div class="image-card" data-category="city">
        <img src="images/city2.jpg" alt="City">
    </div>

    <div class="image-card" data-category="animals">
        <img src="images/animal1.jpg" alt="Animal">
    </div>

    <div class="image-card" data-category="animals">
        <img src="images/animal2.jpg" alt="Animal">
    </div>

    </div>
    <script src="script.js"></script>
    

</body>
</html>
